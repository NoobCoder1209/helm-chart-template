{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "http-echo.serviceAccountName" . }}
  labels:
    {{- include "http-echo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- else if .Values.serviceAccount.annotations -}}
{{- fail "serviceAccount.annotations is set but serviceAccount.create is false; annotations would be ignored. Either flip create=true or move the annotations elsewhere." -}}
{{- end }}
