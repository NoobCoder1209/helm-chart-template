{{- if and .Values.secret.enabled (not .Values.externalSecrets.enabled) -}}
{{- if or .Values.secret.data .Values.secret.stringData -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "http-echo.fullname" . }}
  labels:
    {{- include "http-echo.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secret.data }}
data:
  {{- toYaml .Values.secret.data | nindent 2 }}
{{- end }}
{{- if .Values.secret.stringData }}
stringData:
  {{- toYaml .Values.secret.stringData | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
