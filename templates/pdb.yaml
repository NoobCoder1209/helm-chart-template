{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) (not .Values.autoscaling.enabled) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "http-echo.fullname" . }}
  labels:
    {{- include "http-echo.labels" . | nindent 4 }}
spec:
  {{- if ne (toString .Values.podDisruptionBudget.maxUnavailable) "<nil>" }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else if ne (toString .Values.podDisruptionBudget.minAvailable) "<nil>" }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "http-echo.selectorLabels" . | nindent 6 }}
{{- else if and .Values.podDisruptionBudget.enabled .Values.autoscaling.enabled -}}
{{- /*
  When autoscaling is enabled, the HPA owns replica count. We still want a PDB
  but only when minReplicas > 1, otherwise PDB blocks all evictions.
*/ -}}
{{- if gt (int .Values.autoscaling.minReplicas) 1 -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "http-echo.fullname" . }}
  labels:
    {{- include "http-echo.labels" . | nindent 4 }}
spec:
  {{- if ne (toString .Values.podDisruptionBudget.maxUnavailable) "<nil>" }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else if ne (toString .Values.podDisruptionBudget.minAvailable) "<nil>" }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "http-echo.selectorLabels" . | nindent 6 }}
{{- end -}}
{{- end -}}
